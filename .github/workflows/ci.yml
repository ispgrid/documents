name: CI

# The add-on is tested inside an ISPGrid checkout (master), the way the README's Development section does it.
# The weekly run catches a change in ISPGrid that breaks the add-on.
on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: '30 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04

    services:
      mariadb:
        # Ubuntu 24.04 ships MariaDB 10.11, the server the ISPGrid installer sets up.
        image: mariadb:10.11
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: 'yes'
          MARIADB_DATABASE: radius_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: documents
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ispgrid/ispgrid
          ref: master
          path: core
          persist-credentials: false

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.5'
          extensions: mbstring, pdo_mysql, zip, intl
          coverage: none

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: core/package-lock.json

      - name: Install ISPGrid with the add-on
        working-directory: core
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          composer config repositories.ispgrid-documents '{"type": "path", "url": "../documents", "options": {"symlink": true}}'
          composer require ispgrid/documents:@dev --no-interaction --no-progress

      - name: Build assets
        working-directory: core
        run: |
          npm ci
          npm run build

      - name: Prepare the environment
        working-directory: core
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Code style
        working-directory: core
        run: vendor/bin/pint --test ../documents/src ../documents/database ../documents/routes ../documents/tests

      - name: Tests (MariaDB)
        working-directory: core
        env:
          ISPGRID_ADDONS: 'on'
        run: php vendor/bin/pest --test-directory=vendor/ispgrid/documents/tests vendor/ispgrid/documents/tests
