blank_issues_enabled: false
contact_links:
  - name: Security problem
    url: https://github.com/ispgrid/documents/security/advisories/new
    about: Report it privately, not in a public issue.
  - name: Question or idea to talk over
    url: https://github.com/ispgrid/ispgrid/discussions
    about: How to set something up, or an idea that is not a feature request yet. Ask in ISPGrid's Discussions.
  - name: ISPGrid itself
    url: https://github.com/ispgrid/ispgrid/issues
    about: Problems with the panel, the installer or FreeRADIUS go to the ISPGrid repository.
  - name: Feature requests
    url: https://github.com/ispgrid/ispgrid/issues/new?template=feature_request.yml
    about: Ideas for the add-on go to ISPGrid's feature requests, so they are all in one place.
